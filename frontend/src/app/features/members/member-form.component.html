<mat-card class="form-card" id="member-form-card">
  <mat-card-header>
    <mat-card-title>Nuevo socio</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" id="member-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>DNI</mat-label>
        <input matInput formControlName="dni" id="member-dni" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="firstName" id="member-firstname" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Apellido</mat-label>
        <input matInput formControlName="lastName" id="member-lastname" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Dirección</mat-label>
        <input matInput formControlName="address" id="member-address" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Fecha de nacimiento</mat-label>
        <input matInput [matDatepicker]="birthDatePicker" formControlName="birthDate" id="member-birthdate" />
        <mat-datepicker-toggle matIconSuffix [for]="birthDatePicker" />
        <mat-datepicker #birthDatePicker />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="phone" id="member-phone" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email (opcional)</mat-label>
        <input matInput type="email" formControlName="email" id="member-email" />
      </mat-form-field>
      <button mat-flat-button color="primary" type="submit" class="full-width" id="member-submit" [disabled]="busy()">
        Registrar socio
      </button>
      <a mat-button routerLink="/socios" class="full-width" id="member-cancel">Cancelar</a>
    </form>
  </mat-card-content>
</mat-card>
