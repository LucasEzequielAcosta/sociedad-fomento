<h1>Socios</h1>
<form [formGroup]="filters" (ngSubmit)="search(1)" class="filters" id="member-filters">
  <mat-form-field appearance="outline">
    <mat-label>DNI</mat-label>
    <input matInput formControlName="dni" id="filter-dni" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="name" id="filter-name" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Apellido</mat-label>
    <input matInput formControlName="lastName" id="filter-lastname" />
  </mat-form-field>
  <button mat-flat-button color="primary" type="submit" id="filter-submit">Buscar</button>
  <a mat-button routerLink="/socios/nuevo" id="new-member">Nuevo socio</a>
  <a mat-button [href]="exportUrl()" id="export-members">Exportar CSV</a>
</form>
@if (result(); as page) {
  <div class="table-wrapper">
    <table mat-table [dataSource]="page.items" class="full-width" id="members-table">
      <ng-container matColumnDef="dni">
        <th mat-header-cell *matHeaderCellDef>DNI</th>
        <td mat-cell *matCellDef="let member">{{ member.dni }}</td>
      </ng-container>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let member">{{ member.lastName }}, {{ member.firstName }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let member">
          <span class="status-chip" [class]="'status-chip status-' + member.status.toLowerCase()">
            {{ member.status === 'Active' ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let member">
          <a mat-button [routerLink]="['/socios', member.id]" id="view-member-{{ member.id }}">Ver</a>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  </div>
  <mat-paginator
    [length]="page.totalCount"
    [pageIndex]="page.page - 1"
    [pageSize]="page.pageSize"
    [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)"
    id="members-paginator"
  />
}
